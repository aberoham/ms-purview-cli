name: Public data

on:
  # Every pull request and every push to main, with no path filter, so a
  # change to docs/ or Markdown alone is still checked. The lint keeps
  # tenant identifiers, real addresses, private URLs and review history out
  # of this public repository.
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push supersedes a run in progress. A run on a tag, which only the
# release workflow starts, is never cancelled.
concurrency:
  group: public-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Public-data lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --test fixture_lint
