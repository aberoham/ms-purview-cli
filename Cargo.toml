[package]
name = "ms-purview-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Microsoft Purview eDiscovery (Premium) from the terminal, through Microsoft Graph"
repository = "https://github.com/aberoham/ms-purview-cli"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "fs", "signal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
