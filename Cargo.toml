[package]
name = "ms-purview-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "MIT"
description = "Microsoft Purview eDiscovery (Premium) from the terminal, through Microsoft Graph"
repository = "https://github.com/aberoham/ms-purview-cli"

[[bin]]
name = "purview"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "fs", "signal", "sync"] }
url = "2"
uuid = "1"
getrandom = "0.4"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
csv = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
